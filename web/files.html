<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="selfnas">
<meta name="theme-color" content="#f7f7f5">
<title>文件 · selfnas</title>
<link rel="manifest" href="/assets/manifest.json">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="fs-body">

<header class="fs-head">
  <div class="fs-title">
    <h1 id="dirTitle">文件</h1>
    <span class="fs-sub" id="dirSub"></span>
  </div>
  <!-- 根目录切换：桌面端跟标题同一行（像浏览器标签），手机端整行换到第二行 -->
  <div class="fs-roots" id="rootsBar"></div>
  <div class="fs-head-actions">
    <button class="chip" id="btnRecent">最近</button>
    <!-- 叫「收藏夹」而不是「收藏」：面包屑那个「☆ 收藏」是动作，这个是列表，同名会混 -->
    <button class="chip" id="btnFav">收藏夹</button>
    <button class="icon-btn" id="btnRefresh" title="刷新">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="btnPoster" title="分享给朋友">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
    <a class="icon-btn" href="/admin" title="管理台">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.5a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
    <!-- 桌面端的上传/新建放在顶栏（手机端藏在底部栏，这两个元素只在 ≥768px 显示） -->
    <div class="fs-head-tools">
      <label class="btn primary sm" for="filePicker" data-upload>上传文件</label>
      <button class="btn sm" data-mkdir>新建文件夹</button>
    </div>
  </div>
</header>

<!-- 导航行拆两行：路径一行、工具（收藏/排序）一行。
     路径可能很长（长文件夹名、层级深），挤在一行时收藏星钉在滚动容器右缘、
     路径文字从按钮底下穿过去，看着像按钮盖住了路径。分两行后路径整行自用。 -->
<div class="fs-nav">
  <div class="fs-crumb" id="crumb"></div>
  <div class="fs-tools">
    <button class="crumb-star" id="crumbStar" hidden></button>
    <div class="fs-sort" id="sortBar">
      <span class="fs-sort-lbl">排序</span>
      <button class="chip" data-sort="name">名称</button>
      <button class="chip" data-sort="time">时间</button>
    </div>
  </div>
</div>

<!-- 列标题：桌面端才显示。大小/时间两列原来没有任何标签，浮在页面中间不知道是什么 -->
<div class="fs-colhead">
  <div class="ch-main"></div>
  <div class="ch-size">大小</div>
  <div class="ch-time">修改时间</div>
  <div class="ch-more"></div>
</div>

<main class="fs-list" id="list"></main>

<div class="fs-uploadbox" id="uploadBox"></div>

<!-- 分享海报：代码在 canvas 里画好再用 <img> 显示 ——
     img 在手机上可以长按保存，canvas 不行（iOS 长按画布不弹菜单） -->
<div class="overlay" id="poster">
  <div class="poster-wrap">
    <div class="poster-head">
      <span>分享给朋友</span>
      <button class="icon-btn" id="posterClose" title="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="poster-body" id="posterBody">
      <div class="poster-loading">正在生成海报…</div>
    </div>
    <div class="poster-foot">
      <button class="btn primary sm" id="posterSave">保存图片</button>
      <span class="poster-hint">iPhone：长按图片 → 存储到照片</span>
    </div>
  </div>
</div>

<footer class="fs-actions">
  <label class="btn primary" id="btnUpload" for="filePicker" data-upload>上传文件</label>
  <button class="btn" id="btnMkdir" data-mkdir>新建文件夹</button>
</footer>

<div class="overlay" id="recent">
  <div class="modal" style="max-width:430px">
    <div class="panel-tabs" id="panelTabs">
      <button class="ptab on" data-tab="recent">最近</button>
      <button class="ptab" data-tab="fav">收藏夹</button>
    </div>
    <div class="recent-list" id="recentList"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="recentClear">清空</button>
      <button class="btn" id="recentClose">关闭</button>
    </div>
  </div>
</div>

<div class="overlay" id="sheet">
  <div class="modal" style="max-width:360px">
    <h3 id="sheetTitle">操作</h3>
    <div class="sheet-btns">
      <button class="btn" data-act="fav">收藏</button>
      <button class="btn" data-act="download">下载到本机</button>
      <button class="btn" data-act="rename">重命名</button>
      <button class="btn" data-act="move">移动到…</button>
      <button class="btn danger" data-act="delete">删除</button>
    </div>
    <div class="modal-actions"><button class="btn ghost" id="sheetCancel">取消</button></div>
  </div>
</div>

<div class="overlay" id="mvSheet">
  <div class="modal" style="max-width:440px">
    <h3>移动到</h3>
    <div class="mv-src" id="mvSrc"></div>
    <div class="mv-crumb" id="mvCrumb"></div>
    <div class="mv-list" id="mvList"></div>
    <div class="err" id="mvErr"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="mvCancel">取消</button>
      <button class="btn primary" id="mvOk">移到这里</button>
    </div>
  </div>
</div>

<div class="overlay" id="prompt">
  <div class="modal" style="max-width:380px">
    <h3 id="promptTitle">输入名称</h3>
    <div class="field" style="margin-top:14px"><input type="text" id="promptInput"></div>
    <div class="err" id="promptErr"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="promptCancel">取消</button>
      <button class="btn primary" id="promptOk">确定</button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <span id="viewerName"></span>
    <div class="vb-act">
      <button class="icon-btn" id="viewerFav" title="收藏">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>
      </button>
      <button class="icon-btn" id="viewerRot" title="转 90°">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="viewerClose" title="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
  <div class="viewer-foot" id="viewerFoot"></div>
  <div class="viewer-hint" id="viewerHint">
    <button class="hint-btn" id="hintRotate">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      转 90° 铺满
    </button>
  </div>
</div>

<div id="login">
  <form class="login-box" id="loginForm">
    <h2>selfnas</h2>
    <p class="sub">输入后台密码即可，下次自动登录</p>
    <div class="field"><label>账号</label><input type="text" id="loginUser" value="admin" autocomplete="username"></div>
    <div class="field"><label>密码</label><input type="password" id="loginPass" autocomplete="current-password" placeholder="就是管理台那个密码"></div>
    <button class="btn primary" type="submit">登录</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<input type="file" id="filePicker" class="vh" multiple>
<div class="toast" id="toast"></div>
<script src="/assets/files.js"></script>
</body>
</html>
